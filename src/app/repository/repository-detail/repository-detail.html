<div class="detail-page" *ngIf="repository">
  <button class="back-btn" (click)="goBack()">
    <svg viewBox="0 0 16 16" fill="currentColor" width="16" height="16">
      <path fill-rule="evenodd" d="M7.78 12.53a.75.75 0 01-1.06 0L2.47 8.28a.75.75 0 010-1.06l4.25-4.25a.75.75 0 011.06 1.06L4.81 7h7.44a.75.75 0 010 1.5H4.81l2.97 2.97a.75.75 0 010 1.06z"/>
    </svg>
    Volver a repositorios
  </button>

  <div class="detail-card">
    <div class="card-header">
      <svg class="repo-icon" viewBox="0 0 16 16" fill="currentColor" width="20" height="20">
        <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1h-8a1 1 0 00-1 1v6.708A2.486 2.486 0 014.5 9h8V1.5zm-8 11h8v-1.5h-8a1 1 0 000 1.5z"/>
      </svg>
      <h1>{{ repository.name }}</h1>
    </div>
    <p class="description">{{ repository.description }}</p>

    <div class="info-grid">
      <div class="info-block">
        <span class="label">Lenguaje</span>
        <span class="value lang-value">
          <span class="lang-dot" [style.background-color]="getLanguageColor(repository.language)"></span>
          {{ repository.language }}
        </span>
      </div>
      <div class="info-block">
        <span class="label">Estrellas</span>
        <span class="value stars-value">
          <svg viewBox="0 0 16 16" fill="#e3b341" width="16" height="16">
            <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
          </svg>
          {{ repository.stars }}
        </span>
      </div>
      <div class="info-block">
        <span class="label">Creado</span>
        <span class="value">{{ formatDate(repository.createdAt) }}</span>
      </div>
      <div class="info-block">
        <span class="label">ID del propietario</span>
        <span class="value mono">{{ repository.ownerId }}</span>
      </div>
    </div>
  </div>
</div>

<div class="not-found" *ngIf="!repository">
  <p>Repositorio no encontrado.</p>
  <button class="back-btn" (click)="goBack()">Volver</button>
</div>
