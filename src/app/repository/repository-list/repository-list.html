<div class="page-header">
  <h1>Repositorios</h1>
  <div class="stats">
    <span class="stat">{{ repositories.length }} repos</span>
    <span class="stat">{{ totalStars }} estrellas</span>
    <span class="stat">{{ languageCount }} lenguajes</span>
  </div>
</div>

<div class="repo-grid">
  <a
    class="repo-card"
    *ngFor="let repo of repositories"
    [routerLink]="['/repositories', repo.id]"
  >
    <div class="repo-top">
      <svg class="repo-icon" viewBox="0 0 16 16" fill="currentColor" width="16" height="16">
        <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1h-8a1 1 0 00-1 1v6.708A2.486 2.486 0 014.5 9h8V1.5zm-8 11h8v-1.5h-8a1 1 0 000 1.5z"/>
      </svg>
      <span class="repo-name">{{ repo.name }}</span>
    </div>
    <p class="repo-desc">{{ repo.description }}</p>
    <div class="repo-meta">
      <span class="lang">
        <span class="lang-dot" [style.background-color]="getLanguageColor(repo.language)"></span>
        {{ repo.language }}
      </span>
      <span class="stars">
        <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14">
          <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
        </svg>
        {{ repo.stars }}
      </span>
    </div>
  </a>
</div>
