<div class="page-header">
  <h1>Usuarios</h1>
  <div class="stats">
    <span class="stat">{{ totalUsers }} usuarios</span>
    <span class="stat">{{ totalWithRepos }} con repositorios</span>
  </div>
</div>

<div class="master-detail" [class.has-detail]="selectedUser">
  <div class="user-grid">
    <table class="user-table">
      <thead>
        <tr>
          <th></th>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Ubicación</th>
          <th>Repos</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let user of users"
          (click)="onSelectUser(user)"
          [class.selected]="selectedUser?.id === user.id"
        >
          <td>
            <img [src]="user.avatarUrl" [alt]="user.name" class="avatar" />
          </td>
          <td>
            <div class="user-cell">
              <span class="user-name">{{ user.name }}</span>
              <span class="user-handle">@{{ user.username }}</span>
            </div>
          </td>
          <td>
            <span class="badge" [ngClass]="getRoleBadgeClass(user.role)">{{ user.role }}</span>
          </td>
          <td class="location-cell">{{ user.location }}</td>
          <td class="repo-count">{{ user.repoIds.length }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="detail-panel" *ngIf="selectedUser">
    <app-user-detail
      [user]="selectedUser"
      (closed)="selectedUser = null"
    ></app-user-detail>
  </div>
</div>
